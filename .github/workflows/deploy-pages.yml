name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate access passcode
        env:
          VITE_PROTOTYPE_PASSCODE: ${{ secrets.VITE_PROTOTYPE_PASSCODE }}
        run: |
          if [ -z "$VITE_PROTOTYPE_PASSCODE" ]; then
            echo "::error::Missing VITE_PROTOTYPE_PASSCODE GitHub Actions secret."
            exit 1
          fi

      - name: Build site
        env:
          VITE_PROTOTYPE_PASSCODE: ${{ secrets.VITE_PROTOTYPE_PASSCODE }}
        run: npm run build -- --base /clauseiq-v4/

      - name: Prepare Pages artifacts
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
